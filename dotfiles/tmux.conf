# ============================================================
# tmux config - minimal working version
# ============================================================

# ---- Prefix:Ctrl-x ----
unbind C-b
set -g prefix C-x
bind C-x send-prefix

# ---- 基本 ----
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
#set -ag terminal-overrides ",*:Ms=\\E]52;c;%p2%s\\7"
set -as terminal-features ",*:clipboard"


set -g history-limit 10000
set -g escape-time 0
set -g default-shell @ZSH_PATH@

# ---- Window 從 1 開始 ----
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ---- 關掉 bell ----
set -g visual-bell off
set -g bell-action none

# ---- 滑鼠 ----
set -g mouse on
set -g set-clipboard on

# ---- copy mode (vi keys) ----
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# ---- 開新 window/pane 沿用當前路徑 ----
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ---- Reload ----
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# ============================================================
# Status bar
# ============================================================
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=white,bg=default"

set -g status-left "#[fg=green,bold][ #H ] "
set -g status-left-length 30

set -g status-right "#[fg=green,bold][ %Y-%m-%d %H:%M ]"
set -g status-right-length 30

set -g window-status-format         " #I #{b:pane_current_path}:#{pane_current_command} "
set -g window-status-current-format "#[fg=yellow,bold][ #I #{b:pane_current_path}:#{pane_current_command} ]"
